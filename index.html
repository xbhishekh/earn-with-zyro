<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Favicon - Cliperus branded Z logo -->
    <!-- Use a versioned asset path to force recrawl/cache refresh across clients + bots -->
    <!-- Some crawlers still prefer /favicon.ico, so provide both .ico and .png -->
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="icon" href="/favicon-v2.png" type="image/png" />
    <link rel="icon" href="/favicon-v2.png" type="image/png" sizes="48x48" />
    <link rel="icon" href="/favicon-v2.png" type="image/png" sizes="512x512" />
    <link rel="icon" href="/favicon-v2.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/favicon-v2.png" sizes="180x180" />
    <link rel="shortcut icon" href="/favicon-v2.png" type="image/png" />
    
    <!-- Preconnect to critical domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://kfrruzoygqilzvfwbdqr.supabase.co" />
    
    <!-- Preload fonts with display=swap for non-blocking render -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" /></noscript>
    
    <!-- Primary SEO Meta Tags -->
    <title>Cliperus — Creator Rewards Platform</title>
    <meta name="title" content="Cliperus — Creator Rewards Platform" />
    <meta name="description" content="Join 5,000+ creators earning real money on Cliperus. Get paid for every view on TikTok, YouTube &amp; Instagram. $50K+ already paid out. Start earning today!">
    <meta name="keywords" content="creator rewards, earn money creating content, UGC platform, clipping campaigns, affiliate earnings, creator marketplace, get paid for views, TikTok earnings, YouTube monetization, content creator platform">
    <meta name="author" content="Cliperus" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cliperus" />
    <meta property="og:image" content="https://earn-with-zyro.lovable.app/og-image.png" />
    <meta name="twitter:image" content="https://earn-with-zyro.lovable.app/og-image.png" />
    
    
    <meta property="og:image:alt" content="Cliperus — #1 Creator Rewards Platform" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Cliperus" />
    <meta name="twitter:creator" content="@Cliperus" />
    
    
    <meta name="twitter:image:alt" content="Cliperus — #1 Creator Rewards Platform" />
    
    <!-- Additional SEO Tags -->
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="msapplication-TileColor" content="#0d0d0d" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cliperus" />
    
    <!-- Structured Data - Organization & Website -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Cliperus",
      "alternateName": "Cliperus Media",
      "url": "https://cliperus.com",
      "logo": {
        "@type": "ImageObject",
        "url": "https://cliperus.com/favicon-512.png",
        "width": 512,
        "height": 512
      },
      "image": "https://cliperus.com/og-image.png",
      "description": "Cliperus is the #1 creator rewards platform where content creators earn money for their videos on TikTok, YouTube, and Instagram.",
      "foundingDate": "2022",
      "sameAs": [
        "https://twitter.com/cliperus",
        "https://instagram.com/cliperus",
        "https://youtube.com/@cliperus",
        "https://tiktok.com/@cliperus"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "hello@cliperus.com",
        "contactType": "customer service",
        "availableLanguage": ["English"]
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Cliperus",
      "alternateName": "Cliperus Creator Platform",
      "url": "https://cliperus.com",
      "description": "The #1 creator rewards platform. Earn money for your content.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://cliperus.com/campaigns?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    
  
  
  
  
  
  <meta property="og:title" content="Cliperus — Creator Rewards Platform">
  <meta name="twitter:title" content="Cliperus — Creator Rewards Platform">
  <meta property="og:description" content="Join 5,000+ creators earning real money on Cliperus. Get paid for every view on TikTok, YouTube &amp; Instagram. $50K+ already paid out. Start earning today!">
  <meta name="twitter:description" content="Join 5,000+ creators earning real money on Cliperus. Get paid for every view on TikTok, YouTube &amp; Instagram. $50K+ already paid out. Start earning today!">
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
