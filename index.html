    <!-- Favicon - Zyrozo branded Z logo -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://kfrruzoygqilzvfwbdqr.supabase.co" />

    <!-- Primary SEO Meta Tags -->
    <title>Zyrozo - 1 Creator Rewards Platform | Earn Money Creating Content</title>
    <meta name="title" content="Zyrozo - #1 Creator Rewards Platform | Earn Money Creating Content" />

    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://zyrozo.com/" />

    <!-- Structured Data - Organization & Website -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Zyrozo",
      "alternateName": "Zyrozo Media",
      "url": "https://zyrozo.com",
      "logo": {
        "@type": "ImageObject",
        "url": "https://zyrozo.com/favicon-512.png",
        "width": 512,
        "height": 512
      },
      "image": "https://zyrozo.com/og-image.png",

        "@type": "ContactPoint",
        "email": "hello@zyrozo.com",

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Zyrozo",
      "alternateName": "Zyrozo Creator Platform",
      "url": "https://zyrozo.com",
      "description": "The #1 creator rewards platform. Earn money for your content.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://zyrozo.com/campaigns?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
